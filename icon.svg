<!-- Source for the app icon. Full bleed, opaque, no corner rounding:
     iOS applies its own squircle mask, so rounding it here leaves artefacts.
     The PNGs are generated by mkicon.py, not rasterised from this file. -->
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="0.55" stop-color="#2B5BE8"/>
      <stop offset="1" stop-color="#1B36B8"/>
    </linearGradient>
    <radialGradient id="hl" cx="50.4" cy="39.6" r="135" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="180" height="180" fill="url(#bg)"/>
  <rect width="180" height="180" fill="url(#hl)"/>
  <g fill="#fff">
    <path d="M 90.0 86.76 L 93.98 33.85 A 53.1 53.1 0 0 1 135.85 90.76 Z"/>
    <path d="M 92.81 91.62 L 136.62 122.28 A 53.1 53.1 0 0 1 46.83 119.9 Z"/>
    <path d="M 87.19 91.62 L 41.59 116.06 A 53.1 53.1 0 0 1 82.09 33.4 Z"/>
  </g>
</svg>
